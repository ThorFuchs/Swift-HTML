# SPDX-License-Identifier: Apache-2.0
name: Documentation site

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'swifthtml-pages-deploy' || format('swifthtml-pages-build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Official swift:6.4.2-noble multi-architecture image.
      image: swift@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build DocC static site
        run: Scripts/build-docc.sh "$RUNNER_TEMP/docc-build" "$RUNNER_TEMP/site" Swift-HTML
      - name: Redirect the site root to the module page
        run: |
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=documentation/swifthtml/"><link rel="canonical" href="documentation/swifthtml/"><title>SwiftHTML</title><a href="documentation/swifthtml/">SwiftHTML documentation</a>' > "$RUNNER_TEMP/site/index.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
